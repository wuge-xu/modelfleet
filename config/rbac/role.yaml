---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - serving.modelfleet.io
  resources:
  - modelservices
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - serving.modelfleet.io
  resources:
  - modelservices/finalizers
  verbs:
  - update
- apiGroups:
  - serving.modelfleet.io
  resources:
  - modelservices/status
  verbs:
  - get
  - patch
  - update
